    <circle cx="260" cy="424" r="13" fill="#F2ECDD" stroke="#B9AE93" stroke-width="2.5"/>
    <text x="260" y="462" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.6" fill="#5C5342">MADRASI</text>
    <text x="260" y="480" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" fill="#8A7E64">WHITE</text>
