    <circle cx="398" cy="706" r="6"/><circle cx="424" cy="700" r="7"/><circle cx="446" cy="706" r="5"/>
    <circle cx="466" cy="700" r="6"/><circle cx="486" cy="694" r="5"/><circle cx="308" cy="694" r="5"/>
