    <path d="M450 300 Q448 280 470 276 L610 276 Q632 280 630 300 L638 600 Q636 622 614 624 L466 624 Q444 622 446 600 Z" fill="url(#sackShade)"/>
    <rect x="452" y="268" width="184" height="16" rx="8" fill="#5F6D7A"/>
    <polyline points="460,276 476,268 492,276 508,268 524,276 540,268 556,276 572,268 588,276 604,268 620,276" fill="none" stroke="#4C5863" stroke-width="4" stroke-linecap="round"/>
