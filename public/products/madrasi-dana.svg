    <path d="M398 430 Q396 408 420 404 L584 404 Q608 408 606 430 L618 668 Q616 692 592 694 L412 694 Q388 692 390 668 Z" fill="url(#sackShade)"/>
    <rect x="404" y="392" width="200" height="20" rx="10" fill="#D58F51"/>
    <polyline points="412,402 430,392 448,402 466,392 484,402 502,392 520,402 538,392 556,402 574,392 592,402" fill="none" stroke="#B3763C" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="430" y="510" width="148" height="96" rx="9" fill="#FFFFFF" stroke="#C9813F" stroke-width="2.5"/>
    <circle cx="504" cy="538" r="15" fill="#F0A868" stroke="#C9813F" stroke-width="2.5"/>
    <text x="504" y="578" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1.8" fill="#4A4235">MADRASI</text>
    <text x="504" y="598" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4" fill="#8A7E64">PEACH</text>
