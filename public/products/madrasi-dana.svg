<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Madrasi dana wall texture sacks in white, red, peach and grey with granules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F7F2E8"/>
      <stop offset="1" stop-color="#E9DFCC"/>
    </linearGradient>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="none"/>
      <path d="M0 3.5 H14 M3.5 0 V14" stroke="#000000" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <linearGradient id="sackShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="pile" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E8D9BC"/>
      <stop offset="1" stop-color="#C9B493"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="700" rx="300" ry="36" fill="#5C4A33" opacity="0.16"/>

