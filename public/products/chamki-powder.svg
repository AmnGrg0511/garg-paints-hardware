<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Chamki glitter powder pouch with golden metallic flakes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#232A36"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6D87C"/>
      <stop offset="0.5" stop-color="#E4B33F"/>
      <stop offset="1" stop-color="#C08F1E"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2C3542"/>
      <stop offset="1" stop-color="#1B2230"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="694" rx="250" ry="30" fill="#000000" opacity="0.45"/>

  <!-- Pouch -->
  <path d="M232 176 Q232 148 264 144 L536 144 Q568 148 568 176 L586 636 Q588 668 552 672 L248 672 Q212 668 214 636 Z" fill="url(#pouch)" stroke="#E4B33F" stroke-opacity="0.5" stroke-width="3.5"/>
  <!-- Zip seal -->
  <rect x="248" y="128" width="304" height="26" rx="12" fill="none" stroke="#E4B33F" stroke-opacity="0.45" stroke-width="3.5" stroke-dasharray="12 8"/>
  <!-- Shine -->
  <path d="M262 168 L262 640 L296 640 L296 168 Z" fill="#FFFFFF" opacity="0.10"/>
  <path d="M548 190 L548 632 L526 632 L526 190 Z" fill="#000000" opacity="0.18"/>

  <!-- Label -->
  <rect x="268" y="330" width="264" height="140" rx="12" fill="url(#label)" stroke="#E4B33F" stroke-opacity="0.4" stroke-width="2.5"/>
  <text x="400" y="392" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="4" fill="#E9C356">CHAMKI</text>
  <text x="400" y="432" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.6" fill="#9AA6B8">GLITTER POWDER</text>

  <!-- Flakes inside the pouch -->
  <g fill="url(#gold)">
    <path d="M300 560 l14 10 -14 10 -14 -10 Z"/>
    <path d="M348 540 l11 8 -11 8 -11 -8 Z"/>
    <path d="M396 556 l15 11 -15 11 -15 -11 Z"/>
    <path d="M446 538 l12 9 -12 9 -12 -9 Z"/>
    <path d="M494 560 l14 10 -14 10 -14 -10 Z"/>
    <path d="M330 596 l10 8 -10 8 -10 -8 Z"/>
    <path d="M380 606 l12 9 -12 9 -12 -9 Z"/>
    <path d="M436 598 l11 8 -11 8 -11 -8 Z"/>
    <path d="M480 610 l10 8 -10 8 -10 -8 Z"/>
    <circle cx="366" cy="522" r="7"/>
    <circle cx="424" cy="516" r="6"/>
    <circle cx="462" cy="524" r="7"/>
    <circle cx="308" cy="516" r="6"/>
    <circle cx="510" cy="522" r="6"/>
  </g>

  <!-- Spilled flakes -->
  <g fill="url(#gold)">
    <path d="M280 700 l13 10 -13 9 -13 -9 Z"/>
    <path d="M330 716 l11 8 -11 8 -11 -8 Z"/>
    <path d="M386 704 l14 10 -14 10 -14 -10 Z"/>
    <path d="M440 716 l11 8 -11 8 -11 -8 Z"/>
    <path d="M496 702 l13 9 -13 10 -13 -10 Z"/>
    <circle cx="306" cy="716" r="7"/>
    <circle cx="362" cy="726" r="6"/>
    <circle cx="414" cy="712" r="7"/>
    <circle cx="468" cy="726" r="6"/>
    <circle cx="520" cy="714" r="6"/>
  </g>

  <!-- Sparkles -->
  <g fill="#F6D87C">
    <path d="M258 262 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M548 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path d="M522 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>
</svg>
