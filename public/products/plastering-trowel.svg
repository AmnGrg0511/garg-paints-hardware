<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Stainless steel gurmala plastering trowel with a turned wooden handle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2F4F8"/>
      <stop offset="1" stop-color="#E2E7EE"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FDFEFF"/>
      <stop offset="0.3" stop-color="#DCE3EA"/>
      <stop offset="0.55" stop-color="#B4BfCB"/>
      <stop offset="0.78" stop-color="#EAF0F4"/>
      <stop offset="1" stop-color="#C0C9D3"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C09159"/>
      <stop offset="0.45" stop-color="#9A6A38"/>
      <stop offset="1" stop-color="#74501F"/>
    </linearGradient>
    <linearGradient id="compound" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#EFE4CF"/>
      <stop offset="1" stop-color="#D8C8A8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="672" rx="300" ry="30" fill="#33415C" opacity="0.10"/>

  <!-- Wooden handle, rising up-left from the blade -->
  <g>
    <!-- Ferrule -->
    <path d="M342 402 L394 396 L400 428 L348 434 Z" fill="#C7CFD9" stroke="#8C99A8" stroke-width="3"/>
    <!-- Handle body -->
    <path d="M352 404
             C332 386 316 348 310 300
             C306 268 312 240 334 232
             C358 224 380 244 388 276
             C396 310 400 356 400 396 Z"
          fill="url(#handle)" stroke="#6B4620" stroke-width="3"/>
    <!-- Turn rings on the handle -->
    <path d="M322 262 C336 254 354 256 366 268" fill="none" stroke="#7C522A" stroke-width="3" opacity="0.6"/>
    <path d="M316 296 C332 288 352 290 366 302" fill="none" stroke="#7C522A" stroke-width="3" opacity="0.6"/>
    <path d="M314 330 C330 322 352 324 368 336" fill="none" stroke="#7C522A" stroke-width="3" opacity="0.6"/>
    <!-- Handle highlight -->
    <path d="M336 250 C322 262 318 296 324 336" fill="none" stroke="#E8C28F" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Blade: long rounded trapezoid -->
  <g>
    <path d="M116 432
             Q112 404 146 400
             L636 384
             Q676 384 680 412
             Q682 440 644 444
             L152 476
             Q120 478 116 432 Z"
          fill="url(#blade)" stroke="#9AA6B4" stroke-width="3"/>
    <!-- Polished top edge -->
    <path d="M116 432 Q112 404 146 400 L636 384 Q676 384 680 412" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
    <!-- Reflection streak -->
    <rect x="200" y="416" width="330" height="9" rx="4.5" fill="#FFFFFF" opacity="0.5"/>
    <!-- Rivet holes near the handle -->
    <circle cx="470" cy="410" r="9" fill="#7C8896"/>
    <circle cx="470" cy="410" r="4.5" fill="#39434F"/>
    <circle cx="530" cy="404" r="8" fill="#7C8896"/>
    <circle cx="530" cy="404" r="4" fill="#39434F"/>
    <circle cx="590" cy="400" r="8" fill="#7C8896"/>
    <circle cx="590" cy="400" r="4" fill="#39434F"/>
  </g>

  <!-- Texture compound dollop -->
  <path d="M540 560 Q536 528 576 524 L628 520 Q666 522 668 548 Q670 574 634 578 L576 582 Q542 580 540 560 Z" fill="url(#compound)" stroke="#C3B08A" stroke-width="2.5"/>
  <path d="M554 552 Q558 540 580 538 L620 536" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
