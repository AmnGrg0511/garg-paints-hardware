<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Stainless steel gurmala plastering trowel with a riveted wooden handle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2F4F8"/>
      <stop offset="1" stop-color="#E2E7EE"/>
    </linearGradient>
    <!-- Blade: polished spring steel running diagonally -->
    <linearGradient id="blade" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#FDFEFF"/>
      <stop offset="0.28" stop-color="#DEE5EB"/>
      <stop offset="0.5" stop-color="#AEB9C4"/>
      <stop offset="0.72" stop-color="#EDF1F5"/>
      <stop offset="1" stop-color="#BFC9D4"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C2925B"/>
      <stop offset="0.45" stop-color="#9A6A38"/>
      <stop offset="1" stop-color="#6E4A22"/>
    </linearGradient>
    <linearGradient id="compound" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#EFE4CF"/>
      <stop offset="1" stop-color="#D6C5A3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="660" rx="290" ry="28" fill="#33415C" opacity="0.10"/>

  <!-- Blade: wide rounded rectangle, 10in x 4in proportions -->
  <g>
    <path d="M118 452
             Q110 424 146 418
             L648 396
             Q690 394 694 424
             Q698 452 660 456
             L156 490
             Q120 494 118 452 Z"
          fill="url(#blade)" stroke="#93A0AE" stroke-width="3"/>
    <!-- Sharpened working edge -->
    <path d="M156 490 Q120 494 118 452 L118 452" fill="none" stroke="#8C99A7" stroke-width="2.5"/>
    <path d="M146 418 L648 396 Q690 394 694 424" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.95"/>
    <!-- Steel reflection streaks -->
    <rect x="220" y="424" width="300" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>
    <rect x="560" y="414" width="80" height="6" rx="3" fill="#FFFFFF" opacity="0.35"/>
    <!-- Rivet holes: handle mounts at the blade centre -->
    <circle cx="452" cy="424" r="8" fill="#77828F"/>
    <circle cx="452" cy="424" r="4" fill="#39434E"/>
    <circle cx="500" cy="421" r="7" fill="#77828F"/>
    <circle cx="500" cy="421" r="3.5" fill="#39434E"/>
  </g>

  <!-- Riveted mount plate on the blade -->
  <rect x="428" y="408" width="96" height="40" rx="6" fill="#D7DEE5" stroke="#93A0AE" stroke-width="2.5" transform="rotate(-3 476 428)"/>

  <!-- Wooden handle: ergonomic, slightly upswept, with rivets -->
  <g>
    <path d="M392 412
             C372 396 350 362 342 318
             C336 284 344 250 372 242
             C398 234 420 258 428 292
             C436 328 440 372 440 408
             Q438 424 420 424
             Z"
          fill="url(#handle)" stroke="#63411D" stroke-width="3"/>
    <!-- Handle wood grain -->
    <path d="M362 262 C354 288 352 322 358 356" fill="none" stroke="#7C522A" stroke-width="2.5" opacity="0.55"/>
    <path d="M382 256 C376 286 374 320 378 354" fill="none" stroke="#7C522A" stroke-width="2.5" opacity="0.45"/>
    <!-- Handle highlight -->
    <path d="M354 250 C346 272 344 306 350 340" fill="none" stroke="#EACD9C" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <!-- Rivets through the mount plate -->
    <circle cx="384" cy="300" r="6.5" fill="#C7CFD9" stroke="#8C99A8" stroke-width="2"/>
    <circle cx="392" cy="348" r="6" fill="#C7CFD9" stroke="#8C99A8" stroke-width="2"/>
    <circle cx="402" cy="392" r="6" fill="#C7CFD9" stroke="#8C99A8" stroke-width="2"/>
    <!-- Hang hole at the handle end -->
    <circle cx="376" cy="248" r="5" fill="#4A3115" stroke="#8C99A8" stroke-width="2"/>
  </g>

  <!-- Texture compound dollop -->
  <path d="M540 560 Q536 528 576 524 L628 520 Q666 522 668 548 Q670 574 634 578 L576 582 Q542 580 540 560 Z" fill="url(#compound)" stroke="#C3B08A" stroke-width="2.5"/>
  <path d="M554 552 Q558 540 580 538 L620 536" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
